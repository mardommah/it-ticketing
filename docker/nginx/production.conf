server {
    listen 80;
    server_name ticketing.yourdomain.com; # Ganti dengan domain/IP Anda
    return 301 https://$host$request_uri; # Redirect HTTP ke HTTPS
}

server {
    listen 443 ssl http2;
    server_name ticketing.yourdomain.com; # Ganti dengan domain/IP Anda

    # SSL Config (Ganti path sesuai SSL Let's Encrypt Anda)
    ssl_certificate /etc/letsencrypt/live/ticketing.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketing.yourdomain.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # App Root (Nginx HANYA membaca folder public)
    root /var/www/it-ticketing/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blokir akses ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(Makefile|.env|storage/.*\.php) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # FastCGI PHP-FPM Configuration
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan dengan socket PHP VPS Anda
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Keamanan tambahan fastcgi
        fastcgi_hide_header X-Powered-By;
    }

    # Cache Control untuk static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|docx)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    client_max_body_size 50M; # Penting agar bisa upload lampiran ukuran besar
}
