server {
    listen 80;
    server_name ticketing.yourdomain.com; # Ganti dengan domain Anda
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ticketing.yourdomain.com; # Ganti dengan domain Anda

    # Cloudflare Origin Certificate (Download dari Cloudflare Dashboard > SSL/TLS > Origin Server)
    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/it-ticketing/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Blokir file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ ^/(Makefile|\.env|storage/.*\.php) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|docx)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    client_max_body_size 50M;
}
